name: Reassemble and Deploy Chunked Uploads
permissions:
  contents: write
  pull-requests: write
  actions: read
  checks: write
on:
  push:
    branches: [ chunked-upload-* ]
    paths: [ '*.manifest.json' ]
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch with chunked files'
        required: true
        default: 'chunked-upload-'

jobs:
  reassemble:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          
      - name: Find manifest files
        id: find-manifests
        run: |
          echo "🔍 Looking for manifest files..."
          manifests=$(find . -name "*.manifest.json" -type f)
          if [ -z "$manifests" ]; then
            echo "❌ No manifest files found"
            exit 1
          fi
          
          echo "📋 Found manifest files:"
          echo "$manifests"
          
          # Use the first manifest found
          manifest_file=$(echo "$manifests" | head -n1)
          echo "📄 Using manifest: $manifest_file"
          echo "manifest_file=$manifest_file" >> $GITHUB_OUTPUT
          
      - name: Read manifest
        id: read-manifest
        run: |
          manifest_file="${{ steps.find-manifests.outputs.manifest_file }}"
          echo "📖 Reading manifest: $manifest_file"
          
          # Extract information from manifest
          filename=$(jq -r '.filename' "$manifest_file")
          total_chunks=$(jq -r '.totalChunks' "$manifest_file")
          total_size=$(jq -r '.totalSize' "$manifest_file")
          
          echo "📊 File: $filename"
          echo "📦 Total chunks: $total_chunks"
          echo "📏 Total size: $total_size bytes"
          
          echo "filename=$filename" >> $GITHUB_OUTPUT
          echo "total_chunks=$total_chunks" >> $GITHUB_OUTPUT
          echo "total_size=$total_size" >> $GITHUB_OUTPUT
          
      - name: Check all chunks exist
        run: |
          manifest_file="${{ steps.find-manifests.outputs.manifest_file }}"
          total_chunks="${{ steps.read-manifest.outputs.total_chunks }}"
          
          echo "🔍 Checking if all chunks exist..."
          missing_chunks=0
          
          for i in $(seq 1 $total_chunks); do
            chunk_file="${{ steps.read-manifest.outputs.filename }}.part$i"
            if [ ! -f "$chunk_file" ]; then
              echo "❌ Missing chunk: $chunk_file"
              missing_chunks=$((missing_chunks + 1))
            else
              chunk_size=$(stat -c%s "$chunk_file")
              echo "✅ Chunk $i: $chunk_file (${chunk_size} bytes)"
            fi
          done
          
          if [ $missing_chunks -gt 0 ]; then
            echo "❌ Missing $missing_chunks chunks. Cannot reassemble file."
            exit 1
          fi
          
          echo "✅ All chunks found!"
          
      - name: Reassemble file
        run: |
          filename="${{ steps.read-manifest.outputs.filename }}"
          total_chunks="${{ steps.read-manifest.outputs.total_chunks }}"
          
          echo "🔧 Reassembling $filename from $total_chunks chunks..."
          
          # Create the reassembled file
          > "$filename" # Clear/create file
          
          for i in $(seq 1 $total_chunks); do
            chunk_file="${filename}.part$i"
            echo "📦 Adding chunk $i/$total_chunks: $chunk_file"
            cat "$chunk_file" >> "$filename"
          done
          
          # Verify the reassembled file
          final_size=$(stat -c%s "$filename")
          expected_size="${{ steps.read-manifest.outputs.total_size }}"
          
          echo "📊 Reassembly complete:"
          echo "   Expected size: $expected_size bytes"
          echo "   Actual size: $final_size bytes"
          
          if [ "$final_size" -eq "$expected_size" ]; then
            echo "✅ File size matches expected size"
          else
            echo "❌ File size mismatch!"
            exit 1
          fi
          
          # Check if it's a zip file
          if [[ "$filename" == *.zip ]]; then
            echo "🗜️ Detected ZIP file, will unzip after reassembly"
            echo "is_zip=true" >> $GITHUB_OUTPUT
          else
            echo "📄 File is not a ZIP, proceeding with deployment"
            echo "is_zip=false" >> $GITHUB_OUTPUT
          fi
          
      - name: Unzip if needed
        if: steps.read-manifest.outputs.filename == 'playlist.json.zip'
        run: |
          echo "🗜️ Unzipping playlist.json.zip..."
          
          # Install 7zip
          sudo apt-get update
          sudo apt-get install p7zip-full -y
          
          # Check if it's actually a zip file
          if 7z t playlist.json.zip > /dev/null 2>&1; then
            echo "✅ Valid ZIP file detected"
            
            # List contents
            echo "📋 ZIP contents:"
            7z l playlist.json.zip
            
            # Extract the JSON file
            7z x -y playlist.json.zip -o.
            
            # Check what was extracted
            echo "📁 Extracted files:"
            ls -la *.json
            
            # Verify playlist.json exists and is valid
            if [ -f "playlist.json" ]; then
              echo "✅ playlist.json extracted successfully"
              
              # Validate JSON
              if python3 -c "import json; json.load(open('playlist.json'))" 2>/dev/null; then
                echo "✅ playlist.json is valid JSON"
                
                # Check file size
                json_size=$(stat -c%s "playlist.json")
                json_size_mb=$(echo "scale=2; $json_size/1024/1024" | bc)
                echo "📊 playlist.json size: ${json_size_mb}MB"
                
              else
                echo "❌ playlist.json is not valid JSON"
                exit 1
              fi
            else
              echo "❌ playlist.json not found after extraction"
              exit 1
            fi
            
          else
            echo "❌ Invalid ZIP file or not a ZIP file"
            exit 1
          fi
          
      - name: Validate final JSON file
        run: |
          echo "🔍 Validating final JSON file..."
          
          # Check if playlist.json exists (either reassembled or extracted)
          if [ -f "playlist.json" ]; then
            echo "✅ playlist.json found"
            
            # Validate JSON syntax
            if python3 -c "import json; json.load(open('playlist.json'))" 2>/dev/null; then
              echo "✅ playlist.json is valid JSON"
            else
              echo "❌ playlist.json is not valid JSON"
              exit 1
            fi
            
            # Check file size
            size=$(stat -c%s "playlist.json")
            size_mb=$(echo "scale=2; $size/1024/1024" | bc)
            echo "📊 playlist.json size: ${size_mb}MB"
            
            if (( $(echo "$size_mb > 100" | bc -l) )); then
              echo "⚠️ Warning: File is very large (${size_mb}MB)"
            fi
            
          else
            echo "❌ Error: playlist.json not found"
            exit 1
          fi
          
      - name: Commit reassembled file
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: |
            Reassemble and deploy ${{ steps.read-manifest.outputs.filename }}
            
            - Reassembled from ${{ steps.read-manifest.outputs.total_chunks }} chunks
            - Total size: ${{ steps.read-manifest.outputs.total_size }} bytes
            - Timestamp: $(date -u +"%Y-%m-%d %H:%M:%S UTC")
            - Workflow: ${{ github.workflow }}
          file_pattern: |
            playlist.json
            *.json
          commit_user_name: 'GitHub Action'
          commit_user_email: 'action@github.com'
          
      - name: Clean up chunk files
        run: |
          filename="${{ steps.read-manifest.outputs.filename }}"
          total_chunks="${{ steps.read-manifest.outputs.total_chunks }}"
          
          echo "🧹 Cleaning up chunk files..."
          
          # Remove chunk files
          for i in $(seq 1 $total_chunks); do
            chunk_file="${filename}.part$i"
            if [ -f "$chunk_file" ]; then
              rm "$chunk_file"
              echo "🗑️ Removed: $chunk_file"
            fi
          done
          
          # Remove manifest file
          manifest_file="${{ steps.find-manifests.outputs.manifest_file }}"
          if [ -f "$manifest_file" ]; then
            rm "$manifest_file"
            echo "🗑️ Removed: $manifest_file"
          fi
          
          # Remove zip file if it was extracted
          if [ -f "$filename" ] && [[ "$filename" == *.zip ]]; then
            rm "$filename"
            echo "🗑️ Removed: $filename"
          fi
          
          echo "✅ Cleanup complete"
          
      - name: Commit cleanup
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: 'Clean up chunk files after reassembly'
          file_pattern: |
            *.part*
            *.manifest.json
            *.zip
          commit_user_name: 'GitHub Action'
          commit_user_email: 'action@github.com'
          
      - name: Push changes to trigger PR
        run: |
          echo "📤 Pushing changes to trigger pull request..."
          git push origin HEAD:${{ github.ref_name }} --force
          echo "✅ Changes pushed successfully"
          
      - name: Wait for branch to be ready
        run: |
          echo "⏳ Waiting for branch to be ready..."
          sleep 10
          
      - name: Create Pull Request to Main
        id: create-pr
        run: |
          echo "🔀 Creating pull request to main branch..."
          
          # Get branch name (remove refs/heads/ prefix)
          BRANCH_NAME=${GITHUB_REF#refs/heads/}
          BASE_BRANCH="main"
          
          echo "📋 Branch: $BRANCH_NAME -> $BASE_BRANCH"
          
          # Check if PR already exists
          existing_pr=$(gh pr list --head "$BRANCH_NAME" --base "$BASE_BRANCH" --json number --jq '.[0].number' 2>/dev/null || echo "")
          
          if [ -n "$existing_pr" ]; then
            echo "✅ Pull request #$existing_pr already exists"
            echo "pr_number=$existing_pr" >> $GITHUB_OUTPUT
          else
            # Create PR
            pr_result=$(gh pr create \
              --title "🚀 Auto-Deploy playlist.json from chunked upload" \
              --body "## 🎉 Automated Playlist Deployment
            
            This pull request was created automatically by the reassemble workflow.
            
            **What Happened:**
            ✅ Chunks were reassembled successfully
            ✅ File was unzipped (if needed)
            ✅ JSON validation passed
            ✅ Ready for deployment to main branch
            
            **Details:**
            - Source Branch: \`$BRANCH_NAME\`
            - Target Branch: \`$BASE_BRANCH\`
            - Workflow: ${{ github.workflow }}
            - Timestamp: $(date -u +"%Y-%m-%d %H:%M:%S UTC")
            
            **Files Updated:**
            - playlist.json (ready for use)
            
            **Note:** This playlist.json is now ready to use after merging!" \
              --base "$BASE_BRANCH" \
              --head "$BRANCH_NAME" \
              --json number,url)
            
            if [ $? -eq 0 ]; then
              pr_number=$(echo "$pr_result" | jq -r '.number')
              pr_url=$(echo "$pr_result" | jq -r '.url')
              echo "✅ Pull request created successfully: #$pr_number"
              echo "🔗 PR URL: $pr_url"
              echo "pr_number=$pr_number" >> $GITHUB_OUTPUT
              echo "pr_url=$pr_url" >> $GITHUB_OUTPUT
            else
              echo "❌ Failed to create pull request"
              exit 1
            fi
          fi
          
      - name: Auto-merge PR
        id: auto-merge
        if: steps.create-pr.outputs.pr_number != ''
        run: |
          echo "🤖 Attempting auto-merge..."
          
          pr_number="${{ steps.create-pr.outputs.pr_number }}"
          echo "🔍 Found PR #$pr_number, attempting merge..."
          
          # Wait a bit for GitHub to process the PR
          echo "⏳ Waiting for PR to be ready for merge..."
          sleep 15
          
          # Try to merge with different strategies
          echo "🔄 Attempting merge with 'merge' strategy..."
          if gh pr merge "$pr_number" --merge --delete-branch; then
            echo "✅ PR #$pr_number merged successfully with 'merge' strategy!"
            echo "🎉 playlist.json is now available on main branch!"
            echo "merged=true" >> $GITHUB_OUTPUT
          else
            echo "⚠️ 'merge' strategy failed, trying 'squash'..."
            if gh pr merge "$pr_number" --squash --delete-branch; then
              echo "✅ PR #$pr_number merged successfully with 'squash' strategy!"
              echo "🎉 playlist.json is now available on main branch!"
              echo "merged=true" >> $GITHUB_OUTPUT
            else
              echo "⚠️ 'squash' strategy failed, trying 'rebase'..."
              if gh pr merge "$pr_number" --rebase --delete-branch; then
                echo "✅ PR #$pr_number merged successfully with 'rebase' strategy!"
                echo "🎉 playlist.json is now available on main branch!"
                echo "merged=true" >> $GITHUB_OUTPUT
              else
                echo "❌ All merge strategies failed"
                echo "📋 Please merge PR #$pr_number manually"
                echo "🔗 PR URL: ${{ steps.create-pr.outputs.pr_url }}"
                echo "merged=false" >> $GITHUB_OUTPUT
              fi
            fi
          fi
          
      - name: Verify deployment to main
        if: steps.auto-merge.outputs.merged == 'true'
        run: |
          echo "🔍 Verifying deployment to main branch..."
          
          # Wait for GitHub to process the merge
          echo "⏳ Waiting for merge to be processed..."
          sleep 20
          
          # Check if playlist.json exists on main branch
          main_file_url="https://api.github.com/repos/${{ github.repository }}/contents/playlist.json?ref=main"
          
          # Try to fetch the file from main branch
          if curl -s -f "$main_file_url" > /dev/null; then
            echo "✅ playlist.json successfully deployed to main branch!"
            echo "🎉 File is now ready to use!"
            
            # Get file info
            file_info=$(curl -s "$main_file_url")
            file_size=$(echo "$file_info" | jq -r '.size // 0')
            file_size_mb=$(echo "scale=2; $file_size/1024/1024" | bc)
            
            echo "📊 File size: ${file_size_mb}MB"
            echo "🔗 View file: https://github.com/${{ github.repository }}/blob/main/playlist.json"
            
          else
            echo "⚠️ playlist.json not yet available on main branch"
            echo "💡 This might take a few minutes to propagate"
          fi
          
      - name: Final Status
        run: |
          echo "🎉 Workflow completed!"
          echo ""
          echo "📋 Summary:"
          echo "✅ Chunks reassembled successfully"
          echo "✅ File unzipped (if needed)"
          echo "✅ JSON validation passed"
          echo "✅ Pull request created"
          
          if [ -n "${{ steps.create-pr.outputs.pr_number }}" ]; then
            if [ "${{ steps.auto-merge.outputs.merged }}" == "true" ]; then
              echo "✅ Pull request auto-merged"
              echo "🎉 playlist.json is now available on main branch!"
            else
              echo "⚠️ Pull request created but merge failed"
              echo "📋 Please merge PR #${{ steps.create-pr.outputs.pr_number }} manually"
              echo "🔗 PR URL: ${{ steps.create-pr.outputs.pr_url }}"
            fi
          fi
          
          echo ""
          echo "📁 playlist.json is ready for deployment!"
          echo "🔗 View file: https://github.com/${{ github.repository }}/blob/main/playlist.json"
          echo ""
          echo "💡 Next steps:"
          if [ "${{ steps.auto-merge.outputs.merged }}" == "true" ]; then
            echo "✅ File is already deployed to main branch!"
            echo "🎉 You can now use the playlist data!"
          else
            echo "1. Review and merge the pull request"
            echo "2. playlist.json will be available on main branch"
            echo "3. You can then use the playlist data"
          fi