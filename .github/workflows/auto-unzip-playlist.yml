name: Auto Unzip Playlist
on:
  push:
    branches: [ main ]
    paths:
      - playlist.json.zip
permissions:
  contents: write
jobs:
  unzip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Unzip to JSON
        run: |
          unzip -o "playlist.json.zip" -d .
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add "playlist.json"
          git commit -m "Auto-unzip playlist.json.zip -> playlist.json" || echo "No changes to commit"
          git push
