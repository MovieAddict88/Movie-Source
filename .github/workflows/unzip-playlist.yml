name: Unzip playlist.json.zip
permissions:
  contents: write
on:
  push:
    branches: [ upload-* ]
    paths: [ 'playlist.json.zip' ]
jobs:
  unzip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Increases timeout for large files
          fetch-depth: 0  
          # Prevents partial checkouts
          sparse-checkout: | 
            playlist.json.zip

      - name: Unzip with efficient tool
        run: |
          # Install 7z for better compression handling
          sudo apt-get install p7zip-full -y  
          # Extract specific file efficiently
          7z x -y playlist.json.zip -o. playlist.json  

      - name: Commit result
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: 'Unzip playlist.json.zip to playlist.json'
          # Commit only the JSON file
          file_pattern: playlist.json  
